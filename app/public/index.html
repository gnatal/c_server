<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Static Server Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #4CAF50;
            font-size: 24px;
        }
        .info {
            text-align: left;
            margin-top: 20px;
            font-size: 18px;
        }
        .info p {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Express Server is Working! 🚀</h1>
        <p>This is a static HTML file served by Express.</p>
        
        <div class="info">
            <p><strong>Name:</strong> Guilherme Natal</p>
            <p><strong>Age:</strong> 31</p>
            <p><strong>Location:</strong> Argentina</p>
        </div>
    </div>

</body>
</html>
