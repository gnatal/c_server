name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make liburing-dev libsqlite3-dev
      - name: Test
        run: make test
      - name: Build demo
        run: make demo
      - name: Check API docs
        run: make check-docs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test (clang)
        run: make CC=clang test
